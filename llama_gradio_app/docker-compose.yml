version: '3'

services:
  gradio-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./tmp:/app/tmp
    networks:
      - web

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./deployment/ishtar-ai.com.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - ./static:/app/static
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gradio-app
    networks:
      - web

networks:
  web:
    driver: bridge 